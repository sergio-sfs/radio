<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Radio">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Radio</title>
<style>
html{--bg:#0f1115;--sf:#181c25;--bd:#2b3140;--cur:#1b2740;--tx:#eef0f4;--mu:#8d94a8;--ac:#2f6fed;--on:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,system-ui,sans-serif;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 14px 8px;z-index:5;border-bottom:1px solid var(--bd)}
h1{margin:0 0 8px;font-size:22px}
.row{display:flex;gap:8px}
input[type=search]{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font-size:16px}
select{padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font-size:15px}
.tabs{display:flex;gap:8px;margin-top:8px}
.tab{flex:1;padding:9px;border-radius:10px;background:var(--sf);border:1px solid var(--bd);color:var(--mu);text-align:center;font-weight:600}
.tab.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px}
.chip{flex:none;padding:6px 12px;border-radius:99px;background:var(--sf);border:1px solid var(--bd);color:var(--tx);font-size:14px}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.st{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--bd)}
.st.cur{background:var(--cur)}
.logo{width:44px;height:44px;border-radius:10px;background:var(--bd) center/cover;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px}
.info{flex:1;min-width:0}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav{font-size:24px;background:none;border:0;color:#556;padding:6px}
.fav.on{color:#ffcc33}
#msg{padding:30px 20px;text-align:center;color:var(--mu)}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--bd);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px}
#bar .info{cursor:default}
.ctl{width:46px;height:46px;border-radius:50%;border:0;background:var(--ac);color:var(--on);font-size:20px}
.ctl.s{width:38px;height:38px;background:var(--bd);color:var(--tx);font-size:16px}

#mx{display:none;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:0 0 10px}
#mx.show{display:block}
#mx label{display:flex;align-items:center;gap:10px;font-size:14px;margin:6px 0}
#mx label span{width:56px;color:var(--mu)}
#mx input[type=range]{flex:1;accent-color:var(--ac)}
#mx .t{font-weight:600;margin:4px 0}
#mx button{background:var(--bd);color:var(--tx);border:0;border-radius:8px;padding:6px 12px}
#eqmsg{font-size:12px;color:var(--mu);margin-top:6px}
.hd{display:flex;align-items:center;justify-content:space-between}
#th{font-size:22px;background:none;border:0;padding:4px 8px}
#sw{display:none;gap:10px;margin:0 0 10px;overflow-x:auto;padding:2px}
#sw.show{display:flex}
.sw{flex:none;width:38px;height:38px;border-radius:50%;border:3px solid var(--bd)}
.sw.on{border-color:var(--ac)}
</style>
</head>
<body>
<header>
  <div class="hd"><h1>📻 Radio <small id="ver" style="font-size:12px;font-weight:400;color:var(--mu)"></small></h1><span><button id="mxb" style="font-size:22px;background:none;border:0;padding:4px 8px">🎚</button><button id="th">🎨</button></span></div>
  <div id="sw"></div>
  <div id="mx">
    <label><span>Volume</span><input type="range" id="vol" min="0" max="1" step="0.01"></label>
    <label class="t"><input type="checkbox" id="eq"> Equalizzatore</label>
    <label><span>Bassi</span><input type="range" class="bd" data-i="0" min="-12" max="12" step="1"></label>
    <label><span>Medi</span><input type="range" class="bd" data-i="1" min="-12" max="12" step="1"></label>
    <label><span>Alti</span><input type="range" class="bd" data-i="2" min="-12" max="12" step="1"></label>
    <button id="rst">Azzera</button>
    <div id="eqmsg"></div>
  </div>
  <div class="row">
    <input type="search" id="q" placeholder="Cerca stazione…">
    <select id="cc"><option value="IT">🇮🇹 Italia</option><option value="">🌍 Mondo</option><option value="CH">🇨🇭 Svizzera</option><option value="GB">🇬🇧 UK</option><option value="US">🇺🇸 USA</option></select>
  </div>
  <div class="tabs"><div class="tab on" id="t-all">Stazioni</div><div class="tab" id="t-fav">★ Preferiti</div></div>
  <div class="chips" id="chips"></div>
</header>
<div id="list"></div>
<div id="msg"></div>
<div id="bar">
  <div class="logo" id="blogo">📻</div>
  <div class="info"><div class="nm" id="bnm">Scegli una stazione</div><div class="sub" id="bsub">&nbsp;</div></div>
  <button class="ctl s" id="prev">⏮</button>
  <button class="ctl" id="pp">▶</button>
  <button class="ctl s" id="next">⏭</button>
</div>
<script>
const $=s=>document.querySelector(s);
const SERVERS=['https://de1.api.radio-browser.info','https://nl1.api.radio-browser.info','https://at1.api.radio-browser.info'];
const GENRES=[['','Tutti'],['pop','Pop'],['rock','Rock'],['news','Notizie'],['talk','Talk'],['jazz','Jazz'],['classical','Classica'],['dance','Dance'],['hits','Hits'],['oldies','Oldies'],['lounge','Lounge'],['hip hop','Hip hop']];
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const THEMES={
 scuro:{n:'Scuro',bg:'#0f1115',sf:'#181c25',bd:'#2b3140',cur:'#1b2740',tx:'#eef0f4',mu:'#8d94a8',ac:'#2f6fed',on:'#fff'},
 nero:{n:'Nero',bg:'#000000',sf:'#101010',bd:'#262626',cur:'#1a1a1a',tx:'#f2f2f2',mu:'#8a8a8a',ac:'#e5484d',on:'#fff'},
 chiaro:{n:'Chiaro',bg:'#f5f6f8',sf:'#ffffff',bd:'#d9dce3',cur:'#e3ecff',tx:'#15181f',mu:'#6a7183',ac:'#2f6fed',on:'#fff'},
 blu:{n:'Blu notte',bg:'#0a1628',sf:'#12233d',bd:'#223a5e',cur:'#1a3a66',tx:'#e8f0ff',mu:'#8fa6c8',ac:'#3aa0ff',on:'#fff'},
 verde:{n:'Verde',bg:'#0c1a14',sf:'#13271d',bd:'#25402f',cur:'#1b3b2a',tx:'#e9f7ee',mu:'#8fb09c',ac:'#2fbf71',on:'#04140b'},
 viola:{n:'Viola',bg:'#150f24',sf:'#201736',bd:'#352a55',cur:'#2c2150',tx:'#f0eaff',mu:'#a99cc9',ac:'#9a6bff',on:'#fff'},
 caldo:{n:'Caldo',bg:'#1c1410',sf:'#2a1e17',bd:'#43322a',cur:'#4a3326',tx:'#fbeee3',mu:'#b99c88',ac:'#f08a24',on:'#1c1410'}
};
function applyTheme(k){
  const t=THEMES[k]||THEMES.scuro, r=document.documentElement.style;
  for(const x of ['bg','sf','bd','cur','tx','mu','ac','on'])r.setProperty('--'+x,t[x]);
  document.querySelector('meta[name=theme-color]').content=t.bg;
  ls.set('theme',k); drawSw(k);
}
function drawSw(k){$('#sw').innerHTML=Object.entries(THEMES).map(([i,t])=>`<div class="sw${i===k?' on':''}" data-k="${i}" title="${t.n}" style="background:linear-gradient(135deg,${t.bg} 50%,${t.ac} 50%)"></div>`).join('')}
$('#th').onclick=()=>$('#sw').classList.toggle('show');
$('#sw').onclick=e=>{const s=e.target.closest('.sw');if(s)applyTheme(s.dataset.k)};
applyTheme(ls.get('theme','scuro'));
let favs=ls.get('favs',[]), tab='all', tag='', list=[], cur=ls.get('last',null), timer;
const VER='v1.4 · 18/11/2026';
const NP='https://noisy-voice-02cb.tbrb2rhtnv.workers.dev/'; let npTitle='', npT=null;
let audio, ctx, gain=null, filt=[];
let eqOn=ls.get('eq',false), vol=ls.get('vol',1), bands=ls.get('bands',[0,0,0]);
function applyVol(){ if(gain){audio.volume=1;gain.gain.value=vol}else audio.volume=vol }
function mk(){
  if(audio){audio.pause();audio.removeAttribute('src');audio.load()}
  audio=new Audio(); audio.preload='none'; filt=[]; gain=null;
  if(eqOn){
    audio.crossOrigin='anonymous';
    try{
      if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
      const s=ctx.createMediaElementSource(audio);
      filt=[['lowshelf',200],['peaking',1000],['highshelf',4000]].map(([t,f],i)=>{const b=ctx.createBiquadFilter();b.type=t;b.frequency.value=f;b.gain.value=bands[i];return b});
      gain=ctx.createGain();
      s.connect(filt[0]);filt[0].connect(filt[1]);filt[1].connect(filt[2]);filt[2].connect(gain);gain.connect(ctx.destination);
    }catch(e){eqOn=false;filt=[];gain=null;audio.removeAttribute('crossorigin')}
  }
  applyVol(); bind();
}
mk();

function build(){ $('#chips').innerHTML=GENRES.map(([v,l])=>`<div class="chip${v===tag?' on':''}" data-t="${v}">${l}</div>`).join(''); }
build();
$('#chips').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;tag=c.dataset.t;build();tab='all';setTab();load()};
function setTab(){$('#t-all').classList.toggle('on',tab==='all');$('#t-fav').classList.toggle('on',tab==='fav');render()}
$('#t-all').onclick=()=>{tab='all';setTab()};
$('#t-fav').onclick=()=>{tab='fav';setTab()};
$('#q').oninput=()=>{clearTimeout(timer);timer=setTimeout(load,400)};
$('#cc').onchange=load;

async function api(path){
  let err;
  for(const s of SERVERS){ try{const r=await fetch(s+path);if(r.ok)return await r.json()}catch(e){err=e} }
  throw err||new Error('api');
}
async function load(){
  $('#msg').textContent='Carico…';
  const p=new URLSearchParams({hidebroken:'true',order:'clickcount',reverse:'true',limit:'300',has_extended_info:'false'});
  const cc=$('#cc').value, name=$('#q').value.trim();
  if(cc)p.set('countrycode',cc); if(name)p.set('name',name); if(tag)p.set('tag',tag);
  try{
    const d=await api('/json/stations/search?'+p);
    const seen=new Set();
    list=d.filter(s=>(s.url_resolved||'').startsWith('https://')).filter(s=>{const k=s.name.trim().toLowerCase();if(seen.has(k))return false;seen.add(k);return true})
      .map(s=>({id:s.stationuuid,name:s.name.trim(),url:s.url_resolved,logo:s.favicon&&s.favicon.startsWith('https')?s.favicon:'',tags:(s.tags||'').split(',').slice(0,3).join(', '),cc:s.countrycode}));
    ls.set('cache',list.slice(0,100));
  }catch(e){ list=ls.get('cache',[]); $('#msg').textContent=list.length?'Offline: elenco salvato':'Impossibile caricare le stazioni'; render(); return }
  render();
}
function render(){
  const src=tab==='fav'?favs:list;
  $('#list').innerHTML=src.map(s=>`<div class="st${cur&&cur.id===s.id?' cur':''}" data-id="${s.id}">
    <div class="logo" style="${s.logo?`background-image:url('${s.logo}')`:''}">${s.logo?'':'📻'}</div>
    <div class="info"><div class="nm">${esc(s.name)}</div><div class="sub">${esc(s.tags||'')}</div></div>
    <button class="fav${favs.some(f=>f.id===s.id)?' on':''}" data-f="${s.id}">★</button></div>`).join('');
  $('#msg').textContent=src.length?'':(tab==='fav'?'Nessun preferito: tocca ★ su una stazione':($('#msg').textContent==='Carico…'?'Carico…':'Nessuna stazione trovata'));
  if(src.length&&$('#msg').textContent!=='')$('#msg').textContent=$('#msg').textContent.startsWith('Offline')?$('#msg').textContent:'';
}
function esc(t){return t.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('#list').onclick=e=>{
  const f=e.target.closest('[data-f]');
  if(f){const id=f.dataset.f;const s=[...list,...favs].find(x=>x.id===id);
    favs=favs.some(x=>x.id===id)?favs.filter(x=>x.id!==id):[...favs,s];ls.set('favs',favs);render();return}
  const r=e.target.closest('.st'); if(!r)return;
  const s=[...list,...favs].find(x=>x.id===r.dataset.id); if(s)play(s);
};
function pool(){return tab==='fav'?favs:list}
function play(s){
  cur=s; ls.set('last',s);
  if(ctx&&ctx.state==='suspended')ctx.resume();
  npTitle='';nowPlaying();
  audio.src=s.url; $('#bnm').textContent=s.name; $('#bsub').textContent='Connessione…';
  $('#blogo').style.backgroundImage=s.logo?`url('${s.logo}')`:''; $('#blogo').textContent=s.logo?'':'📻';
  audio.play().catch(()=>{$('#bsub').textContent='Stazione non raggiungibile'});
  if('mediaSession' in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({title:s.name,artist:'Radio',artwork:s.logo?[{src:s.logo,sizes:'192x192'}]:[]});
  }
  render();
}
function step(d){const p=pool();if(!p.length)return;let i=p.findIndex(x=>cur&&x.id===cur.id);play(p[(i+d+p.length)%p.length])}
function nowPlaying(){
  clearInterval(npT); if(!NP||!cur)return;
  const s=cur;
  const go=async()=>{
    try{
      const d=await (await fetch(NP+'?url='+encodeURIComponent(s.url))).json();
      if(cur!==s||!d.title||d.title===npTitle)return;
      npTitle=d.title;
      if(!audio.paused)$('#bsub').textContent='♪ '+npTitle;
      if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:npTitle,artist:s.name,artwork:s.logo?[{src:s.logo,sizes:'192x192'}]:[]});
    }catch(e){}
  };
  go(); npT=setInterval(go,20000);
}
function bind(){
audio.onplaying=()=>{$('#pp').textContent='⏸';$('#bsub').textContent=npTitle?'♪ '+npTitle:'In onda';navigator.mediaSession&&(navigator.mediaSession.playbackState='playing')};
audio.onpause=()=>{$('#pp').textContent='▶';if($('#bsub').textContent==='In onda'||$('#bsub').textContent[0]==='♪')$('#bsub').textContent='In pausa';navigator.mediaSession&&(navigator.mediaSession.playbackState='paused')};
audio.onwaiting=()=>{$('#bsub').textContent='Buffering…'};
audio.onerror=()=>{
  if(eqOn&&cur){eqOn=false;ls.set('eq',false);$('#eq').checked=false;$('#eqmsg').textContent="Questa stazione non supporta l'equalizzatore: disattivato";mk();play(cur);return}
  $('#pp').textContent='▶';$('#bsub').textContent='Stazione non raggiungibile'};
}
$('#pp').onclick=()=>{
  if(!cur){const p=pool();if(p.length)play(p[0]);return}
  if(audio.paused){ if(!audio.src||audio.error)play(cur); else audio.play(); } else { audio.pause(); }
};
$('#next').onclick=()=>step(1); $('#prev').onclick=()=>step(-1);
if('mediaSession' in navigator){
  const m=navigator.mediaSession;
  m.setActionHandler('play',()=>audio.play());
  m.setActionHandler('pause',()=>audio.pause());
  m.setActionHandler('nexttrack',()=>step(1));
  m.setActionHandler('previoustrack',()=>step(-1));
}
if(cur){$('#bnm').textContent=cur.name;$('#bsub').textContent='Tocca ▶';$('#blogo').style.backgroundImage=cur.logo?`url('${cur.logo}')`:''}
(function(){
  const a=new Audio();a.volume=.5;const volOK=a.volume===.5;
  $('#vol').value=vol; $('#eq').checked=eqOn;
  document.querySelectorAll('.bd').forEach(r=>{r.value=bands[+r.dataset.i];r.oninput=()=>{const i=+r.dataset.i;bands[i]=+r.value;ls.set('bands',bands);if(filt[i])filt[i].gain.value=bands[i]}});
  $('#vol').oninput=e=>{vol=+e.target.value;ls.set('vol',vol);applyVol()};
  $('#mxb').onclick=()=>{$('#mx').classList.toggle('show');if(!volOK&&!eqOn)$('#eqmsg').textContent="Su iPhone il volume si regola con i tasti del telefono; con l'equalizzatore attivo funziona anche il cursore."};
  $('#eq').onchange=e=>{
    eqOn=e.target.checked;ls.set('eq',eqOn);$('#eqmsg').textContent='';
    if(ctx&&ctx.state==='suspended')ctx.resume();
    const was=cur&&!audio.paused;mk();if(cur&&was)play(cur);
  };
  $('#rst').onclick=()=>{bands=[0,0,0];ls.set('bands',bands);document.querySelectorAll('.bd').forEach(r=>r.value=0);filt.forEach(f=>f.gain.value=0)};
})();
$('#ver').textContent=VER;
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
load();
</script>
</body>
</html>
